name: Sync Lovable social stats
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Scrape rendered Lovable traction stats
        run: node scripts/sync-lovable-stats.mjs
      - name: Commit updated stats
        run: |
          git config user.name "codefeddy-stats-bot"
          git config user.email "actions@github.com"
          git add data/social-stats.json data/accounts.json data/site.json
          if git diff --cached --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "Refresh Lovable social stats"
            git push
          fi
