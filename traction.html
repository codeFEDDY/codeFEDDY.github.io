  <meta charset="utf-8">

  <title>CODE FEDDY Traction</title>

  <style>
    body.traction-page {
      min-height: 100vh;
      overflow: hidden;
    }

    .traction-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 14px;
      gap: 12px;
    }

    .traction-bar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0,0,0,.28);
    }

    .traction-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .traction-brand img {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: cover;
    }

    .traction-brand strong {
      display: block;
      letter-spacing: -.04em;
    }

    .traction-brand span {
      color: rgba(255,255,255,.64);
      font-size: .86rem;
    }

    .traction-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .traction-actions a {
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(255,255,255,.06);
      font-weight: 900;
      font-size: .86rem;
    }

    .traction-frame-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.34);
      box-shadow: 0 20px 70px rgba(0,0,0,.42);
      min-height: 0;
    }

    .traction-frame {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 104px);
      border: 0;
      background: #050505;
      display: block;
    }

    .frame-fallback {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.72);
      color: rgba(255,255,255,.72);
      font-size: .86rem;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .traction-shell {
        padding: 8px;
      }

      .traction-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .traction-actions {
        justify-content: flex-start;
      }

      .traction-frame {
        min-height: calc(100vh - 150px);
      }
    }
  </style>
</head>
